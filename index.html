<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroPoly Simples</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f7f4; padding: 20px; text-align: center; }
        
        .container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; }
        
        .tabuleiro-wrapper { background: white; padding: 10px; border-radius: 10px; flex: 0 0 auto; }
        .tabuleiro { 
            display: grid; 
            grid-template-columns: 80px repeat(5, 1fr) 80px; 
            grid-template-rows: 80px repeat(5, 1fr) 80px; 
            gap: 0;
            aspect-ratio: 1;
            border: 4px solid #1b5e20;
            background: #e8f5e9;
            width: 500px;
            height: 500px;
        }
        
        .casa {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            border: 1px solid #c8e6c9;
            background: #fafafa;
            position: relative;
        }
        
        .casa span { font-size: 1.5rem; }
        .canto { background: #a5d6a7 !important; font-weight: bold; }
        
        .centro {
            grid-column: 2 / 7;
            grid-row: 2 / 7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
            border: 3px dashed #a5d6a7;
            border-radius: 8px;
            margin: 5px;
        }
        
        .container-peoes {
            position: absolute;
            bottom: 5px;
            display: flex;
            gap: 2px;
        }
        
        .peao { width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; }
        .p1 { background: #e53935; }
        .p2 { background: #1e88e5; }
        .p3 { background: #fdd835; }
        .p4 { background: #8e24aa; }
        
        .painel {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 10px;
            min-width: 250px;
            text-align: left;
        }
        
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; }
        .btn-verde { background: #2e7d32; color: white; }
        .btn-azul { background: #1565c0; color: white; }
        .btn-cinza { background: #757575; color: white; }
        .btn-vermelho { background: #c62828; color: white; }
        
        .log { background: #f5f5f5; padding: 10px; border-radius: 5px; max-height: 100px; overflow-y: auto; margin-top: 10px; border: 1px solid #ddd; font-size: 0.8rem; }
        
        .dados { font-size: 2rem; margin: 10px 0; }
        
        .info { position: absolute; bottom: 2px; right: 2px; width: 14px; height: 14px; background: white; border: 1px solid #1b5e20; border-radius: 50%; font-size: 0.5rem; cursor: pointer; }
        
        .dono-tag { position: absolute; top: 0; left: 0; width: 100%; height: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- TABULEIRO -->
        <div class="tabuleiro-wrapper">
            <div class="tabuleiro" id="tabuleiro">
                <div class="centro">
                    <div style="font-weight:bold;font-size:1.5rem;">AGROPOLY</div>
                    <div style="font-size:0.8rem;">🌿 Produção & Natureza</div>
                    <div class="dados" id="dados">🎲</div>
                    <button class="btn btn-verde" id="btn-rolar">Rolar Dados</button>
                </div>
            </div>
        </div>
        
        <!-- PAINEL -->
        <div class="painel">
            <h2>AgroPoly</h2>
            <div id="config">
                <div style="margin:10px 0;">
                    <label>Jogadores: </label>
                    <select id="qtd-jogadores">
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4" selected>4</option>
                    </select>
                    <label>Bots: </label>
                    <select id="qtd-bots">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                    <button class="btn btn-verde" id="btn-iniciar">Iniciar</button>
                </div>
            </div>
            
            <div id="painel-jogo" style="display:none;">
                <div id="placar" style="display:flex;gap:5px;flex-wrap:wrap;margin:10px 0;"></div>
                <div id="turno" style="font-weight:bold;margin:10px 0;">Aguardando...</div>
                <div class="log" id="log">Bem-vindo!</div>
                <div id="botoes-acao" style="display:none;margin-top:10px;">
                    <button class="btn btn-verde" id="btn-comprar">Comprar</button>
                    <button class="btn btn-azul" id="btn-construir">Construir</button>
                    <button class="btn btn-cinza" id="btn-passar">Passar</button>
                    <button class="btn btn-vermelho" id="btn-falencia">Falência</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== DADOS DAS CASAS =====
        const infoCasas = [
            { id: 0, emoji: "🏠", tipo: "partida", titulo: "Partida", preco: 0, aluguel: 0 },
            { id: 1, emoji: "🌽", tipo: "propriedade", titulo: "Milho", preco: 60, aluguel: 10 },
            { id: 2, emoji: "💧", tipo: "propriedade", titulo: "Gotejamento", preco: 60, aluguel: 12 },
            { id: 3, emoji: "🌲", tipo: "propriedade", titulo: "Eucalipto", preco: 80, aluguel: 15 },
            { id: 4, emoji: "☀️", tipo: "propriedade", titulo: "Solar", preco: 100, aluguel: 20 },
            { id: 5, emoji: "♻️", tipo: "propriedade", titulo: "Campo Limpo", preco: 120, aluguel: 25 },
            { id: 6, emoji: "⛺", tipo: "propriedade", titulo: "EcoTurismo", preco: 140, aluguel: 30 },
            { id: 7, emoji: "🌳", tipo: "propriedade", titulo: "Reserva Legal", preco: 160, aluguel: 35 },
            { id: 8, emoji: "⚡", tipo: "propriedade", titulo: "Biodigestor", preco: 180, aluguel: 40 },
            { id: 9, emoji: "🍀", tipo: "sorte", titulo: "Sorte", preco: 0, aluguel: 0 },
            { id: 10, emoji: "🐝", tipo: "propriedade", titulo: "Meliponário", preco: 200, aluguel: 50 },
            { id: 11, emoji: "🐄", tipo: "propriedade", titulo: "Pecuária CN", preco: 220, aluguel: 55 },
            { id: 12, emoji: "😓", tipo: "prisao", titulo: "Treinamento", preco: 0, aluguel: 0 },
            { id: 13, emoji: "💨", tipo: "propriedade", titulo: "Carbono", preco: 240, aluguel: 65 },
            { id: 14, emoji: "🌊", tipo: "propriedade", titulo: "Nascentes", preco: 260, aluguel: 75 },
            { id: 15, emoji: "⛈️", tipo: "azar", titulo: "Azar", preco: 0, aluguel: 0 },
            { id: 16, emoji: "👨‍👩‍👧", tipo: "propriedade", titulo: "Sucessão", preco: 280, aluguel: 80 },
            { id: 17, emoji: "🦋", tipo: "propriedade", titulo: "Biofábrica", preco: 300, aluguel: 90 },
            { id: 18, emoji: "🌻", tipo: "propriedade", titulo: "Girassol", preco: 320, aluguel: 100 },
            { id: 19, emoji: "🦜", tipo: "propriedade", titulo: "Corredor", preco: 350, aluguel: 120 },
            { id: 20, emoji: "🐑", tipo: "propriedade", titulo: "Silvipastoril", preco: 360, aluguel: 130 },
            { id: 21, emoji: "🍃", tipo: "sorte", titulo: "Adubação", preco: 0, aluguel: 0 },
            { id: 22, emoji: "🫘", tipo: "propriedade", titulo: "Rizóbios", preco: 400, aluguel: 150 },
            { id: 23, emoji: "🏞️", tipo: "propriedade", titulo: "Bacia", preco: 420, aluguel: 160 }
        ];
        
        const ordemLayoutHTML = [
            { col: 1, row: 7 }, { col: 2, row: 7 }, { col: 3, row: 7 }, { col: 4, row: 7 }, { col: 5, row: 7 }, { col: 6, row: 7 },
            { col: 7, row: 7 }, { col: 7, row: 6 }, { col: 7, row: 5 }, { col: 7, row: 4 }, { col: 7, row: 3 }, { col: 7, row: 2 },
            { col: 7, row: 1 }, { col: 6, row: 1 }, { col: 5, row: 1 }, { col: 4, row: 1 }, { col: 3, row: 1 }, { col: 2, row: 1 },
            { col: 1, row: 1 }, { col: 1, row: 2 }, { col: 1, row: 3 }, { col: 1, row: 4 }, { col: 1, row: 5 }, { col: 1, row: 6 }
        ];
        
        let nosCasasDOM = [];
        let listaJogadores = [];
        let donoPropriedades = {};
        let construcoes = {};
        let turnoAtual = 0;
        let jogoIniciado = false;
        
        // ===== MAPEAMENTO =====
        function mapearCasas() {
            const todasCasas = document.querySelectorAll(".casa");
            ordemLayoutHTML.forEach((pos, index) => {
                let el = Array.from(todasCasas).find(c => 
                    c.style.gridColumn === String(pos.col) && c.style.gridRow === String(pos.row)
                );
                if (el) {
                    nosCasasDOM.push(el);
                    if (!el.querySelector('.container-peoes')) {
                        let container = document.createElement('div');
                        container.className = 'container-peoes';
                        el.appendChild(container);
                    }
                }
            });
        }
        
        // ===== CRIA O TABULEIRO =====
        function criarTabuleiro() {
            const tabuleiro = document.getElementById('tabuleiro');
            const posicoes = [
                { col: 1, row: 7, id: 0 }, { col: 2, row: 7, id: 1 }, { col: 3, row: 7, id: 2 }, { col: 4, row: 7, id: 3 },
                { col: 5, row: 7, id: 4 }, { col: 6, row: 7, id: 5 }, { col: 7, row: 7, id: 6 },
                { col: 7, row: 6, id: 7 }, { col: 7, row: 5, id: 8 }, { col: 7, row: 4, id: 9 },
                { col: 7, row: 3, id: 10 }, { col: 7, row: 2, id: 11 },
                { col: 7, row: 1, id: 12 }, { col: 6, row: 1, id: 13 }, { col: 5, row: 1, id: 14 },
                { col: 4, row: 1, id: 15 }, { col: 3, row: 1, id: 16 }, { col: 2, row: 1, id: 17 },
                { col: 1, row: 1, id: 18 },
                { col: 1, row: 2, id: 19 }, { col: 1, row: 3, id: 20 }, { col: 1, row: 4, id: 21 },
                { col: 1, row: 5, id: 22 }, { col: 1, row: 6, id: 23 }
            ];
            
            // remove casas existentes (exceto centro)
            const centro = tabuleiro.querySelector('.centro');
            tabuleiro.innerHTML = '';
            tabuleiro.appendChild(centro);
            
            posicoes.forEach(pos => {
                const casa = document.createElement('div');
                casa.className = 'casa';
                if (pos.id === 0 || pos.id === 6 || pos.id === 12 || pos.id === 18) {
                    casa.classList.add('canto');
                }
                casa.style.gridColumn = String(pos.col);
                casa.style.gridRow = String(pos.row);
                casa.dataset.id = pos.id;
                
                const info = infoCasas[pos.id];
                casa.innerHTML = `
                    <span>${info.emoji}</span>
                    <span>${info.titulo}</span>
                    <button class="info" data-id="${pos.id}">i</button>
                    <div class="container-peoes"></div>
                `;
                
                tabuleiro.appendChild(casa);
            });
            
            // re-mapeia
            nosCasasDOM = [];
            const todasCasas = document.querySelectorAll(".casa");
            posicoes.forEach(pos => {
                let el = Array.from(todasCasas).find(c => 
                    c.style.gridColumn === String(pos.col) && c.style.gridRow === String(pos.row)
                );
                if (el) {
                    nosCasasDOM.push(el);
                }
            });
        }
        
        // ===== DESENHA PEÕES =====
        function desenharPeoes() {
            document.querySelectorAll('.container-peoes').forEach(c => c.innerHTML = '');
            listaJogadores.forEach(j => {
                if (j.saldo >= 0) {
                    const container = nosCasasDOM[j.posicao].querySelector('.container-peoes');
                    if (container) {
                        const peao = document.createElement('div');
                        peao.className = `peao ${j.cor}`;
                        container.appendChild(peao);
                    }
                }
            });
        }
        
        // ===== ATUALIZA PLACAR =====
        function atualizarPlacar() {
            const placar = document.getElementById('placar');
            placar.innerHTML = '';
            listaJogadores.forEach((j, idx) => {
                const div = document.createElement('div');
                div.style.cssText = `
                    padding: 5px 10px; border-left: 4px solid ${j.cor === 'p1' ? '#e53935' : j.cor === 'p2' ? '#1e88e5' : j.cor === 'p3' ? '#fdd835' : '#8e24aa'};
                    background: ${idx === turnoAtual ? '#f1f8e9' : '#fff'};
                    border-radius: 4px;
                    font-size: 0.8rem;
                `;
                div.innerHTML = `<strong>${j.nome}</strong> R$${j.saldo}`;
                placar.appendChild(div);
            });
        }
        
        // ===== LOG =====
        function adicionarLog(msg) {
            const log = document.getElementById('log');
            log.innerHTML = `${msg}<br>` + log.innerHTML;
        }
        
        // ===== INICIAR =====
        function iniciarJogo() {
            const qtdJogadores = parseInt(document.getElementById('qtd-jogadores').value);
            const qtdBots = parseInt(document.getElementById('qtd-bots').value);
            
            if (qtdBots > qtdJogadores) {
                alert('Bots não podem ultrapassar jogadores');
                return;
            }
            
            listaJogadores = [];
            donoPropriedades = {};
            construcoes = {};
            turnoAtual = 0;
            jogoIniciado = true;
            
            document.querySelectorAll('.dono-tag').forEach(t => t.remove());
            
            const cores = ['p1', 'p2', 'p3', 'p4'];
            for (let i = 1; i <= qtdJogadores; i++) {
                const eBot = i > (qtdJogadores - qtdBots);
                listaJogadores.push({
                    id: i,
                    nome: eBot ? `Bot ${i}` : `Jogador ${i}`,
                    saldo: 1500,
                    posicao: 0,
                    cor: cores[i-1],
                    isBot: eBot,
                    presoRodadas: 0
                });
            }
            
            document.getElementById('config').style.display = 'none';
            document.getElementById('painel-jogo').style.display = 'block';
            
            adicionarLog('🎮 Jogo iniciado!');
            atualizarPlacar();
            desenharPeoes();
            processarTurno();
        }
        
        // ===== PROCESSAR TURNO =====
        function processarTurno() {
            if (!jogoIniciado) return;
            atualizarPlacar();
            const jogador = listaJogadores[turnoAtual];
            document.getElementById('turno').innerHTML = `<i class="fas fa-user"></i> Vez de: ${jogador.nome}`;
            
            if (jogador.isBot) {
                document.getElementById('btn-rolar').style.opacity = '0.5';
                document.getElementById('btn-rolar').style.pointerEvents = 'none';
                setTimeout(() => {
                    if (jogador.presoRodadas > 0) {
                        jogador.presoRodadas--;
                        adicionarLog(`🤖 ${jogador.nome} está preso (${jogador.presoRodadas} restantes)`);
                        passarTurno();
                        return;
                    }
                    rolarDados();
                }, 1000);
            } else {
                document.getElementById('btn-rolar').style.opacity = '1';
                document.getElementById('btn-rolar').style.pointerEvents = 'auto';
                if (jogador.presoRodadas > 0) {
                    document.getElementById('btn-rolar').style.opacity = '0.5';
                    document.getElementById('btn-rolar').style.pointerEvents = 'none';
                    adicionarLog(`⛓️ ${jogador.nome} está preso!`);
                    setTimeout(() => {
                        jogador.presoRodadas--;
                        passarTurno();
                    }, 1000);
                }
            }
        }
        
        // ===== ROLAR DADOS =====
        function rolarDados() {
            if (!jogoIniciado) return;
            const jogador = listaJogadores[turnoAtual];
            const d1 = Math.floor(Math.random() * 6) + 1;
            const d2 = Math.floor(Math.random() * 6) + 1;
            const passos = d1 + d2;
            
            document.getElementById('dados').textContent = `${['⚀','⚁','⚂','⚃','⚄','⚅'][d1-1]} ${['⚀','⚁','⚂','⚃','⚄','⚅'][d2-1]}`;
            adicionarLog(`🎲 ${jogador.nome} rolou ${d1}+${d2}=${passos}`);
            
            let novaPosicao = (jogador.posicao + passos) % infoCasas.length;
            if (novaPosicao < jogador.posicao) {
                jogador.saldo += 200;
                adicionarLog(`💰 ${jogador.nome} passou pela partida e ganhou R$200!`);
            }
            
            jogador.posicao = novaPosicao;
            desenharPeoes();
            atualizarPlacar();
            
            setTimeout(() => {
                executarRegra(jogador, infoCasas[novaPosicao]);
            }, 500);
        }
        
        // ===== EXECUTAR REGRA =====
        function executarRegra(jogador, casa) {
            adicionarLog(`📍 ${jogador.nome} parou em ${casa.emoji} ${casa.titulo}`);
            
            if (casa.tipo === 'propriedade') {
                const dono = donoPropriedades[casa.id];
                if (!dono) {
                    // oferece compra
                    if (jogador.saldo >= casa.preco) {
                        if (jogador.isBot) {
                            if (jogador.saldo - casa.preco > 200) {
                                comprar(jogador, casa);
                            } else {
                                adicionarLog(`🤖 ${jogador.nome} não comprou`);
                                passarTurno();
                            }
                        } else {
                            // mostra botões de ação
                            document.getElementById('botoes-acao').style.display = 'flex';
                            document.getElementById('btn-comprar').onclick = () => {
                                comprar(jogador, casa);
                                document.getElementById('botoes-acao').style.display = 'none';
                            };
                            document.getElementById('btn-passar').onclick = () => {
                                adicionarLog(`${jogador.nome} não comprou`);
                                document.getElementById('botoes-acao').style.display = 'none';
                                passarTurno();
                            };
                            document.getElementById('btn-construir').onclick = () => {
                                alert('Você ainda não é dono desta propriedade!');
                            };
                        }
                    } else {
                        adicionarLog(`💸 ${jogador.nome} não tem saldo`);
                        passarTurno();
                    }
                } else if (dono === jogador.id) {
                    // já é dono - oferece construir
                    const nivel = construcoes[casa.id] || 0;
                    if (nivel < 2) {
                        if (jogador.isBot) {
                            const custo = Math.floor(casa.preco * 0.5);
                            if (jogador.saldo >= custo) {
                                construir(jogador, casa, nivel);
                            } else {
                                adicionarLog(`🤖 ${jogador.nome} não construiu`);
                                passarTurno();
                            }
                        } else {
                            document.getElementById('botoes-acao').style.display = 'flex';
                            document.getElementById('btn-construir').onclick = () => {
                                construir(jogador, casa, nivel);
                                document.getElementById('botoes-acao').style.display = 'none';
                            };
                            document.getElementById('btn-passar').onclick = () => {
                                adicionarLog(`${jogador.nome} não construiu`);
                                document.getElementById('botoes-acao').style.display = 'none';
                                passarTurno();
                            };
                            document.getElementById('btn-comprar').onclick = () => {
                                alert('Você já é dono desta propriedade!');
                            };
                        }
                    } else {
                        adicionarLog(`🏢 ${jogador.nome} já tem prédio`);
                        passarTurno();
                    }
                } else {
                    // paga aluguel
                    const donoObj = listaJogadores.find(j => j.id === dono);
                    const nivel = construcoes[casa.id] || 0;
                    const aluguel = nivel === 0 ? casa.aluguel : nivel === 1 ? casa.aluguel * 2 : casa.aluguel * 4;
                    jogador.saldo -= aluguel;
                    donoObj.saldo += aluguel;
                    adicionarLog(`💰 ${jogador.nome} pagou R$${aluguel} para ${donoObj.nome}`);
                    atualizarPlacar();
                    passarTurno();
                }
            } else if (casa.tipo === 'sorte') {
                const bonus = Math.floor(Math.random() * 150) + 100;
                jogador.saldo += bonus;
                adicionarLog(`🍀 ${jogador.nome} ganhou R$${bonus}!`);
                atualizarPlacar();
                passarTurno();
            } else if (casa.tipo === 'azar') {
                const perda = Math.floor(Math.random() * 150) + 100;
                jogador.saldo -= perda;
                adicionarLog(`⛈️ ${jogador.nome} perdeu R$${perda}!`);
                atualizarPlacar();
                passarTurno();
            } else if (casa.tipo === 'prisao') {
                jogador.presoRodadas = 3;
                adicionarLog(`⛓️ ${jogador.nome} foi preso por 3 rodadas!`);
                passarTurno();
            } else {
                passarTurno();
            }
        }
        
        // ===== COMPRAR =====
        function comprar(jogador, casa) {
            jogador.saldo -= casa.preco;
            donoPropriedades[casa.id] = jogador.id;
            construcoes[casa.id] = 0;
            
            const el = nosCasasDOM[casa.id];
            const tag = document.createElement('div');
            tag.className = 'dono-tag';
            tag.style.backgroundColor = jogador.cor === 'p1' ? '#e53935' : jogador.cor === 'p2' ? '#1e88e5' : jogador.cor === 'p3' ? '#fdd835' : '#8e24aa';
            el.appendChild(tag);
            
            adicionarLog(`🛍️ ${jogador.nome} comprou ${casa.titulo} por R$${casa.preco}!`);
            atualizarPlacar();
            passarTurno();
        }
        
        // ===== CONSTRUIR =====
        function construir(jogador, casa, nivel) {
            const custo = Math.floor(casa.preco * 0.5);
            jogador.saldo -= custo;
            construcoes[casa.id] = nivel + 1;
            
            adicionarLog(`🏗️ ${jogador.nome} construiu ${nivel === 0 ? 'uma casa' : 'um prédio'} em ${casa.titulo}!`);
            atualizarPlacar();
            passarTurno();
        }
        
        // ===== PASSAR TURNO =====
        function passarTurno() {
            document.getElementById('botoes-acao').style.display = 'none';
            let proximo = (turnoAtual + 1) % listaJogadores.length;
            let tentativas = 0;
            while (listaJogadores[proximo].saldo <= 0 && tentativas < listaJogadores.length) {
                proximo = (proximo + 1) % listaJogadores.length;
                tentativas++;
            }
            if (tentativas >= listaJogadores.length) {
                adicionarLog('🏆 Fim de jogo!');
                jogoIniciado = false;
                return;
            }
            turnoAtual = proximo;
            processarTurno();
        }
        
        // ===== EVENTOS =====
        document.addEventListener('DOMContentLoaded', function() {
            criarTabuleiro();
            mapearCasas();
            
            document.getElementById('btn-iniciar').addEventListener('click', iniciarJogo);
            document.getElementById('btn-rolar').addEventListener('click', rolarDados);
            document.getElementById('btn-falencia').addEventListener('click', function() {
                const jogador = listaJogadores[turnoAtual];
                if (!jogador) return;
                if (confirm(`⚠️ ${jogador.nome} quer declarar falência?`)) {
                    jogador.saldo = 0;
                    adicionarLog(`💀 ${jogador.nome} faliu!`);
                    atualizarPlacar();
                    passarTurno();
                }
            });
            
            document.querySelectorAll('.info').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    const casa = infoCasas[id];
                    alert(`📖 ${casa.titulo}\n\n${casa.texto || 'Informação sobre esta propriedade.'}\n\nFonte: ${casa.fonte || 'Agrinho 2026'}`);
                });
            });
        });
    </script>

</body>
</html>
